[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "venvstudio"
version = "1.6.98"
description = "Lightweight Python Virtual Environment Manager with modern GUI"
readme = "README_PYPI.md"
license = {text = "LGPL-3.0-or-later"}
authors = [
    {name = "Bayram Kotan", email = "bayramkotan@outlook.com"},
]
keywords = [
    "python", "virtual-environment", "venv", "pip", "uv",
    "package-manager", "gui", "desktop", "qt", "pyside6",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Environment :: Win32 (MS Windows)",
    "Environment :: MacOS X",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "License :: OSI Approved :: GNU Lesser General Public License v3 or later (LGPLv3+)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Installation/Setup",
    "Topic :: Utilities",
]
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.5.0",
    "packaging",
]

[project.optional-dependencies]
dev = [
    "pyinstaller>=6.0",
    "Pillow",
    "pytest",
    "ruff",
]
fast = [
    "uv",
]

[project.urls]
Homepage = "https://github.com/bayramkotan/VenvStudio"
Repository = "https://github.com/bayramkotan/VenvStudio"
Documentation = "https://github.com/bayramkotan/VenvStudio#readme"
"Bug Tracker" = "https://github.com/bayramkotan/VenvStudio/issues"
"Release Notes" = "https://github.com/bayramkotan/VenvStudio/releases"

[project.scripts]
venvstudio = "src.main:main"
vs = "src.main:main"

[project.gui-scripts]
venvstudio-gui = "src.main:main"
vs-gui = "src.main:main"

[tool.setuptools]
packages = ["src", "src.core", "src.gui", "src.utils"]

[tool.setuptools.package-data]
# B132. The old list had "assets/*.png" and friends under "*", which
# setuptools resolves RELATIVE TO EACH PACKAGE DIRECTORY -- and assets/ sits
# at the repository root, inside no package at all. Nothing was ever copied.
# Measured: `pip wheel .` produced a wheel containing no .png whatsoever, and
# on Bayram's machine the installed package had no assets directory.
#
# Only paths that really are inside a package belong here.
"src.utils" = ["*.json"]

# The application icon, installed where an icon belongs rather than inside
# the Python package. Both a pip install into the system and one into a venv
# put these under sys.prefix, so the code can find them either way.
#
# XDG does not scan a venv's share/ directory, which is why the shortcut code
# copies the icon into ~/.local/share/icons/ when it makes a .desktop file
# rather than pointing at this path.
[tool.setuptools.data-files]
# icon.ico as well as icon.png: a Windows .lnk takes an .ico, and without
# one the shortcut inherits the icon of venvstudio.exe -- which is a wrapper
# pip generated, carrying PYTHON's icon. That is what Bayram's desktop
# showed.
"share/pixmaps" = ["assets/icon.png", "assets/icon.ico"]
"share/icons/hicolor/512x512/apps" = ["assets/icon.png"]

# The launcher card icons -- Jupyter, Orange3, Spyder and the rest. Same
# fault as the application icon: they were listed under package-data, which
# never copied them, so every pip install shipped without them and the cards
# fell back to nothing. Globs work here; measured, eight of eight landed in
# the wheel.
"share/venvstudio/app_icons" = [
    "assets/app_icons/*.png",
    "assets/app_icons/*.ico",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
